name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download dependencies
        run: go mod download
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w"
          # linux/amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build ${LDFLAGS} -o dist/gopool-linux-amd64 ./cmd
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build ${LDFLAGS} -o dist/gopool-api-linux-amd64 ./cmd/api
          tar -czf dist/gopool-linux-amd64.tar.gz -C dist gopool-linux-amd64 gopool-api-linux-amd64
          # linux/arm64
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build ${LDFLAGS} -o dist/gopool-linux-arm64 ./cmd
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build ${LDFLAGS} -o dist/gopool-api-linux-arm64 ./cmd/api
          tar -czf dist/gopool-linux-arm64.tar.gz -C dist gopool-linux-arm64 gopool-api-linux-arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          echo "## Release ${{ github.ref_name }}" > RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 HEAD~1)..HEAD --pretty=format:"- %s" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md
