services:
  gopool:
    build: { context: .., dockerfile: Dockerfile }
    container_name: gopool-dev
    ports: ["9100:9100"]
    volumes:
      - ../data:/root/data
      - ../data/config:/root/config:ro
    environment:
      SERVICE: daemon
      SQLITE_DB: /root/data/pool.db
      CONFIG_FILE: /root/config/config.json
      POOL_PRIVATE_KEY_FILE: /run/secrets/gopool_validator_key
    secrets: [gopool_validator_key]
    networks: { devnet: { ipv4_address: 7.0.0.10 } }
    depends_on: [seed1]
    restart: unless-stopped

  gopool-api:
    build: { context: .., dockerfile: Dockerfile }
    container_name: gopool-api-dev
    ports: ["52413:8080"]
    volumes:
      - ../data:/root/data
      - ../data/config:/root/config:rw
    environment:
      SERVICE: api
      SQLITE_DB: /root/data/pool.db
      CONFIG_FILE: /root/config/config.json
      POOL_API_ADDR: :8080
      POOL_SETUP_TOKEN_FILE: /run/secrets/gopool_setup_token
      POOL_SESSION_SECRET_FILE: /run/secrets/gopool_session_secret
    secrets: [gopool_setup_token, gopool_session_secret]
    networks: { devnet: { ipv4_address: 7.0.0.11 } }
    depends_on: [gopool, seed1]
    restart: unless-stopped

secrets:
  gopool_validator_key: { file: ../.secrets/validator-key }
  gopool_setup_token: { file: ../.secrets/setup-token }
  gopool_session_secret: { file: ../.secrets/session-secret }
