version: "3.8"
# Generic Swarm stack. Set GOPOOL_IMAGE and GOPOOL_DOMAIN before deploy.
# Testnet homelab: see docker-stack-test.yml (pool-testnet.maestroi.cc).
services:
  gopool:
    image: ${GOPOOL_IMAGE:-ghcr.io/beardsoft/gopool:latest}
    environment:
      SERVICE: daemon
      SQLITE_DB: /root/data/pool.db
      CONFIG_FILE: /root/config/config.json
      POOL_PRIVATE_KEY_FILE: /run/secrets/gopool_validator_key
      POOL_WALLET_JSON_FILE: /run/secrets/gopool_wallet_json
      VALIDATOR_RPC_URL: http://gopool-validator:8648
      FAUCET_URL: https://faucet.pos.nimiq-testnet.com/tapit
    volumes:
      - gopool_data:/root/data
      - gopool_config:/root/config:ro
    secrets: [gopool_validator_key, gopool_wallet_json]
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/secrets/gopool_validator_key"]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      placement: { constraints: [node.role == manager] }
    networks: [gopool_net]

  # Validator node: produces blocks. RPC is internal (gopool-validator:8648)
  # for CreateValidator and as a pool fallback — not published publicly.
  gopool-validator:
    image: ${NIMIQ_IMAGE:-ghcr.io/nimiq/core-rs-albatross:2.0.0-pre}
    volumes:
      - gopool_validator_data:/home/nimiq/.nimiq
    secrets:
      - source: gopool_node_config
        target: /home/nimiq/.nimiq/client.toml
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      placement: { constraints: [node.role == manager] }
    networks: [gopool_net]

  gopool-api:
    image: ${GOPOOL_IMAGE:-ghcr.io/beardsoft/gopool:latest}
    environment:
      SERVICE: api
      SQLITE_DB: /root/data/pool.db
      CONFIG_FILE: /root/config/config.json
      POOL_API_ADDR: :8080
      POOL_SETUP_TOKEN_FILE: /run/secrets/gopool_setup_token
      POOL_SESSION_SECRET_FILE: /run/secrets/gopool_session_secret
    volumes:
      - gopool_data:/root/data
      - gopool_config:/root/config:rw
    secrets: [gopool_setup_token, gopool_session_secret]
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/secrets/gopool_setup_token && test -r /run/secrets/gopool_session_secret"]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      placement: { constraints: [node.role == manager] }
      labels:
        - traefik.enable=true
        - traefik.swarm.network=web
        - traefik.docker.network=web
        - traefik.http.routers.gopool-api.entrypoints=websecure
        - traefik.http.routers.gopool-api.rule=Host(`${GOPOOL_DOMAIN:-gopool.example.com}`)
        - traefik.http.routers.gopool-api.tls=true
        - traefik.http.services.gopool-api.loadbalancer.server.port=8080
    networks: [gopool_net, web]

networks:
  gopool_net: { driver: overlay }
  web: { external: true }
volumes:
  gopool_data: { driver: local }
  gopool_config: { driver: local }
  gopool_validator_data: { driver: local }
secrets:
  gopool_validator_key: { external: true }
  gopool_wallet_json: { external: true }
  gopool_setup_token: { external: true }
  gopool_session_secret: { external: true }
  gopool_node_config: { external: true }
