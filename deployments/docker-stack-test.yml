version: "3.8"
# Homelab testnet stack: Nimiq test-albatross via rpc-testnet.nimiqscan.com,
# public UI at https://pool-testnet.maestroi.cc
#
#   GOPOOL_IMAGE=ghcr.io/beardsoft/gopool:<sha> \
#     docker stack deploy --with-registry-auth -c deployments/docker-stack-test.yml gopool-test
services:
  gopool:
    image: ${GOPOOL_IMAGE:-ghcr.io/beardsoft/gopool:latest}
    environment:
      SERVICE: daemon
      SQLITE_DB: /root/data/pool.db
      CONFIG_FILE: /root/config/config.json
      POOL_PRIVATE_KEY_FILE: /run/secrets/gopool_test_validator_key
    volumes:
      - gopool_data:/root/data
      - gopool_config:/root/config:ro
    secrets: [gopool_test_validator_key]
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/secrets/gopool_test_validator_key"]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      placement: { constraints: [node.hostname == vm-swarm-worker-01] }
    networks: [gopool_net]

  # Validator node: produces blocks for the pool. Syncs the chain on first
  # start; the pool stakes the validator via the setup wizard. No RPC: the
  # pool keeps using the public testnet RPC.
  gopool-validator:
    image: ${NIMIQ_IMAGE:-ghcr.io/nimiq/core-rs-albatross:2.0.0-pre}
    volumes:
      - gopool_validator_data:/home/nimiq/.nimiq
    secrets:
      - source: gopool_test_node_config
        target: /home/nimiq/.nimiq/client.toml
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      placement: { constraints: [node.hostname == vm-swarm-worker-01] }
    networks: [gopool_net]

  gopool-api:
    image: ${GOPOOL_IMAGE:-ghcr.io/beardsoft/gopool:latest}
    environment:
      SERVICE: api
      SQLITE_DB: /root/data/pool.db
      CONFIG_FILE: /root/config/config.json
      POOL_API_ADDR: :8080
      POOL_SETUP_TOKEN_FILE: /run/secrets/gopool_test_setup_token
      POOL_SESSION_SECRET_FILE: /run/secrets/gopool_test_session_secret
    volumes:
      - gopool_data:/root/data
      - gopool_config:/root/config:rw
    secrets: [gopool_test_setup_token, gopool_test_session_secret]
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/secrets/gopool_test_setup_token && test -r /run/secrets/gopool_test_session_secret"]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      placement: { constraints: [node.hostname == vm-swarm-worker-01] }
      labels:
        - traefik.enable=true
        - traefik.swarm.network=web
        - traefik.docker.network=web
        - traefik.http.routers.gopool-test-api.entrypoints=websecure
        - traefik.http.routers.gopool-test-api.rule=Host(`pool-testnet.maestroi.cc`)
        - traefik.http.routers.gopool-test-api.tls=true
        - traefik.http.services.gopool-test-api.loadbalancer.server.port=8080
    networks: [gopool_net, web]

networks:
  gopool_net: { driver: overlay }
  web: { external: true }
volumes:
  gopool_data: { driver: local }
  gopool_config: { driver: local }
  gopool_validator_data: { driver: local }
secrets:
  gopool_test_validator_key: { external: true }
  gopool_test_setup_token: { external: true }
  gopool_test_session_secret: { external: true }
  gopool_test_node_config: { external: true }
