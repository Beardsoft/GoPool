version: "2"
sql:
  - schema: "./schema/" # Directory where your SQL schema files are located
    queries: "./sql/" # Directory where your SQL query files are located
    engine: "sqlite" # Specify SQLite as the database engine
    gen:
      go:
        package: "db" # The package name for the generated Go files
        out: "internal/db" # The output directory for the generated Go files
        emit_json_tags: true # Include JSON tags in generated structs
        emit_prepared_queries: false # Disable prepared queries
        emit_interface: false # Do not emit interface for queries
        emit_empty_slices: true # Emit empty slices instead of nil for slice fields
        emit_exported_queries: true # Export generated queries
